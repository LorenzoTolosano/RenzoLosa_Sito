<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ordina Articolo A | Renzo Losa</title>

  <link rel="stylesheet" href="https://use.typekit.net/cgj4pdi.css">

  <style>
    :root {
      /* Palette Ufficiale Renzo Losa */
      --bg-color: #F2E2C2;        /* Avorio */
      --text-color: #141F33;      /* Blu Navy */
      --border-color: #4D2E1F;    /* Marrone Scuro */
      --secondary-color: #E6A82E; /* Ocra */
      --accent-color: #992008;    /* Rosso Caldo */
      --accent-hover: #801B07;    /* Rosso Hover */
      
      --card-bg: #FFFFFF;        /* Sfondo schede e form */
      --font-main: "Arboria", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      font-family: var(--font-main); 
      line-height: 1.6; 
      color: var(--text-color); 
      background-color: var(--bg-color); 
    }
    
    /* Header & Navigazione */
    header { 
      background-color: var(--bg-color); 
      border-bottom: 2px solid var(--border-color); 
      position: sticky; 
      top: 0; 
      z-index: 100; 
    }
    nav { 
      max-width: 1000px; 
      margin: 0 auto; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 18px 20px; 
    }
    .logo { 
      font-size: 1.5rem; 
      font-weight: 700; 
      color: var(--text-color); 
      text-decoration: none; 
      letter-spacing: -0.5px;
    }
    .nav-links { list-style: none; display: flex; gap: 24px; }
    .nav-links a { 
      text-decoration: none; 
      color: var(--text-color); 
      font-weight: 600; 
      transition: color 0.2s;
    }
    .nav-links a:hover, .nav-links a.active { 
      color: var(--accent-color); 
    }

    /* Contenitori Generali & Card */
    .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
    .card { 
      background: var(--card-bg); 
      padding: 35px; 
      border-radius: 12px; 
      border: 1px solid rgba(77, 46, 31, 0.15);
      box-shadow: 0 4px 15px rgba(20, 31, 51, 0.05); 
      margin-bottom: 30px; 
    }
    
    h1, h2, h3, h4 { color: var(--text-color); margin-bottom: 15px; }
    p { color: var(--text-color); margin-bottom: 15px; }
    p.subtitle { color: var(--text-color); opacity: 0.8; margin-bottom: 25px; }

    /* Pulsanti di Azione (CTA) */
    .btn, .btn-submit { 
      display: inline-block; 
      text-align: center; 
      background-color: var(--accent-color); 
      color: #ffffff; 
      text-decoration: none; 
      padding: 14px 28px; 
      border-radius: 8px; 
      font-weight: 600; 
      border: none;
      cursor: pointer;
      transition: background-color 0.2s; 
    }
    .btn:hover, .btn-submit:hover { 
      background-color: var(--accent-hover); 
    }
    .btn-secondary {
      background-color: var(--border-color);
    }
    .btn-secondary:hover {
      background-color: #362016;
    }

    /* Homepage: Hero Banner */
    .hero {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 50px 35px;
      text-align: center;
      border: 1px solid rgba(77, 46, 31, 0.15);
      box-shadow: 0 4px 15px rgba(20, 31, 51, 0.05);
      margin-bottom: 40px;
    }
    .hero h1 { font-size: 2.2rem; margin-bottom: 15px; }
    .hero p { font-size: 1.1rem; max-width: 650px; margin: 0 auto 25px auto; }

    /* Homepage: Punti di Forza */
    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
      margin-bottom: 40px;
    }
    .feature-card {
      background: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      border: 1px solid rgba(77, 46, 31, 0.15);
      box-shadow: 0 4px 15px rgba(20, 31, 51, 0.05);
      text-align: center;
    }
    .feature-card h3 { font-size: 1.15rem; margin-bottom: 10px; }
    .feature-card p { font-size: 0.95rem; margin-bottom: 0; }

    /* Homepage: Anteprima Catalogo */
    .preview-section {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 40px 35px;
      text-align: center;
      border: 1px solid rgba(77, 46, 31, 0.15);
      box-shadow: 0 4px 15px rgba(20, 31, 51, 0.05);
      margin-bottom: 40px;
    }
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin: 30px 0;
    }
    .preview-item {
      background: var(--bg-color);
      padding: 30px 20px;
      border-radius: 8px;
      border: 1px solid rgba(77, 46, 31, 0.2);
    }

    /* Griglia Catalogo Completo */
    .catalog-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
    .product-card { 
      background: var(--card-bg); 
      border-radius: 12px; 
      overflow: hidden; 
      border: 1px solid rgba(77, 46, 31, 0.15);
      box-shadow: 0 4px 15px rgba(20, 31, 51, 0.05); 
      display: flex; 
      flex-direction: column; 
    }
    .product-image { 
      background: rgba(77, 46, 31, 0.08); 
      height: 200px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      color: var(--border-color); 
      font-weight: 600; 
    }
    .product-content { padding: 25px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }

    /* Form d'Ordine */
    .form-group { margin-bottom: 20px; text-align: left; }
    label { display: block; font-weight: 600; color: var(--text-color); margin-bottom: 8px; }
    input[type="text"], input[type="email"], input[type="tel"], select, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid rgba(77, 46, 31, 0.25);
      border-radius: 8px;
      font-size: 1rem;
      color: var(--text-color);
      background-color: #fff;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--secondary-color);
      box-shadow: 0 0 0 3px rgba(230, 168, 46, 0.25);
    }

    footer { 
      text-align: center; 
      padding: 30px 20px; 
      font-size: 0.9rem; 
      color: var(--text-color); 
      margin-top: 60px; 
      border-top: 1px solid rgba(77, 46, 31, 0.2); 
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <a href="index.html" class="logo">Renzo Losa</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="catalogo.html">Catalogo</a></li>
        <li><a href="chi-sono.html">Chi Sono</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <div class="card">
      <h1>Configura: Articolo Tipologia A</h1>
      <p class="subtitle">Seleziona le personalizzazioni e compila i tuoi dati per inviarmi la richiesta.</p>

      <!-- Form Nativo collegato a Web3Forms -->
      <form action="https://api.web3forms.com/submit" method="POST">
        
        <!-- INCOLLA LA TUA ACCESS KEY QUI SOTTO -->
        <input type="hidden" name="access_key" value="0a58ea17-3e1b-4836-bb41-2114b6cc08d1">
        <input type="hidden" name="subject" value="Nuova richiesta d'ordine: Articolo Tipologia A">
        <input type="hidden" name="from_name" value="Sito Renzo Losa">

        <!-- Opzioni Specifiche dell'Articolo A -->
        <div class="form-group">
          <label for="variante">Scegli la variante / finitura:</label>
          <select id="variante" name="Variante Selezionata" required>
            <option value="">-- Seleziona un'opzione --</option>
            <option value="Legno Naturale">Legno Naturale</option>
            <option value="Finitura Scura">Finitura Scura</option>
            <option value="Verniciato Bianco">Verniciato Bianco</option>
          </select>
        </div>

        <div class="form-group">
          <label for="personalizzazione">Testo o dedica personalizzata (opzionale):</label>
          <input type="text" id="personalizzazione" name="Testo Personalizzato" placeholder="Es. Nome, data o frase da incidere">
          <p class="help-text">Lascia vuoto se non desideri personalizzazioni di testo.</p>
        </div>

        <div class="form-group">
          <label for="note">Note aggiuntive:</label>
          <textarea id="note" name="Note Cliente" rows="3" placeholder="Scrivi qui eventuali richieste specifiche..."></textarea>
        </div>

        <hr style="border: none; border-top: 1px solid #edf2f7; margin: 25px 0;">

        <!-- Dati Cliente -->
        <div class="form-group">
          <label for="nome">Nome e Cognome:</label>
          <input type="text" id="nome" name="Nome Cliente" required placeholder="Mario Rossi">
        </div>

        <div class="form-group">
          <label for="email">Indirizzo Email:</label>
          <input type="email" id="email" name="Email Cliente" required placeholder="mario.rossi@esempio.com">
        </div>

        <div class="form-group">
          <label for="telefono">Numero di Telefono (opzionale):</label>
          <input type="tel" id="telefono" name="Telefono Cliente" placeholder="333 1234567">
        </div>

        <button type="submit" class="btn-submit">Invia Richiesta d'Ordine</button>

      </form>
    </div>
  </main>

  <footer>
    <p>&copy; Renzo Losa — Tutti i diritti riservati</p>
  </footer>

</body>
</html>
