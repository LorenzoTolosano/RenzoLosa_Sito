<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrello | Renzo Losa</title>
  
  <!-- Adobe Fonts (Arboria) -->
  <link rel="stylesheet" href="https://use.typekit.net/cgj4pdi.css">

  <style>
    :root {
      /* Palette Ufficiale Renzo Losa */
      --bg-color: #F2E6CE;        /* Avorio */
      --text-color: #141F33;      /* Blu Navy */
      --border-color: #4D2E1F;    /* Marrone Scuro */
      --secondary-color: #E6A82E; /* Ocra */
      --accent-color: #992008;    /* Rosso Caldo */
      --accent-hover: #801B07;    /* Rosso Hover */
      --card-bg: #FFFFFF;        
      --font-main: "Arboria", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      font-family: var(--font-main); 
      line-height: 1.6; 
      color: var(--text-color); 
      background-color: var(--bg-color); 
    }
    
    /* Header & Navigazione */
    header { 
      background-color: var(--bg-color); 
      border-bottom: 2px solid var(--border-color); 
      position: sticky; 
      top: 0; 
      z-index: 1000; 
    }
    nav { 
      max-width: 1000px; 
      margin: 0 auto; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 14px 20px; 
    }
    .logo img { height: 38px; width: auto; display: block; }
    
    .nav-links { list-style: none; display: flex; gap: 24px; align-items: center; }
    .nav-links a { text-decoration: none; color: var(--text-color); font-weight: 600; }
    .nav-links a:hover, .nav-links a.active { color: var(--accent-color); }

    .cart-link {
      position: relative;
      background: var(--border-color);
      color: #fff !important;
      padding: 8px 16px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cart-count {
      background: var(--accent-color);
      color: #fff;
      font-size: 0.8rem;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: bold;
    }

    .menu-toggle {
      display: none;
      flex-direction: column;
      justify-content: space-between;
      width: 28px;
      height: 20px;
      background: transparent;
      border: none;
      cursor: pointer;
    }
    .menu-toggle span { width: 100%; height: 3px; background-color: var(--text-color); border-radius: 2px; }

    @media (max-width: 768px) {
      .menu-toggle { display: flex; }
      .nav-links {
        position: absolute;
        top: 100%; left: 0; right: 0;
        background-color: var(--bg-color);
        border-bottom: 2px solid var(--border-color);
        flex-direction: column;
        gap: 0;
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease-in-out;
      }
      .nav-links.active { max-height: 300px; }
      .nav-links li { width: 100%; text-align: center; }
      .nav-links a { display: block; padding: 15px 20px; border-top: 1px solid rgba(77, 46, 31, 0.1); }
      .cart-link { margin: 10px 20px; justify-content: center; }
    }

    /* Layout Carrello */
    .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
    .cart-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 30px;
    }
    @media (max-width: 850px) {
      .cart-grid { grid-template-columns: 1fr; }
    }

    .cart-box, .checkout-box {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      border: 1px solid rgba(77, 46, 31, 0.15);
      box-shadow: 0 4px 15px rgba(20, 31, 51, 0.05);
    }

    h1 { font-size: 2.2rem; margin-bottom: 20px; }
    h2 { font-size: 1.4rem; margin-bottom: 20px; border-bottom: 2px solid var(--secondary-color); display: inline-block; padding-bottom: 4px; }

    /* Lista Articoli nel Carrello */
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid rgba(77, 46, 31, 0.15);
    }
    .cart-item-info h4 { font-size: 1.1rem; color: var(--text-color); margin-bottom: 4px; }
    .cart-item-details { font-size: 0.9rem; opacity: 0.85; line-height: 1.4; }
    .cart-item-price { font-weight: bold; font-size: 1.1rem; color: var(--accent-color); margin-top: 4px; }
    
    .btn-remove {
      background: none;
      border: none;
      color: var(--accent-color);
      cursor: pointer;
      font-size: 1.2rem;
      padding: 5px;
      transition: transform 0.2s;
    }
    .btn-remove:hover { transform: scale(1.2); }

    .empty-cart-msg {
      text-align: center;
      padding: 40px 20px;
      font-size: 1.1rem;
      opacity: 0.8;
    }

    /* Riepilogo Totale */
    .cart-total-bar {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 2px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.3rem;
      font-weight: bold;
    }

    /* Form d'Ordine Web3Forms */
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.95rem; }
    input[type="text"], input[type="email"], input[type="tel"], textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(77, 46, 31, 0.25);
      border-radius: 8px;
      font-size: 0.95rem;
      color: var(--text-color);
      background-color: #fff;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--secondary-color);
      box-shadow: 0 0 0 3px rgba(230, 168, 46, 0.25);
    }

    .btn-submit-order {
      width: 100%;
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      padding: 16px;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 10px;
    }
    .btn-submit-order:hover { background-color: var(--accent-hover); }

    footer { 
      text-align: center; 
      padding: 30px 20px; 
      font-size: 0.9rem; 
      color: var(--text-color); 
      margin-top: 60px; 
      border-top: 1px solid rgba(77, 46, 31, 0.2); 
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <nav>
      <a href="index.html" class="logo">
        <img src="Logotipo_Blu.svg" alt="Renzo Losa">
      </a>
      
      <button class="menu-toggle" id="menuToggle" aria-label="Apri menu">
        <span></span><span></span><span></span>
      </button>

      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="catalogo.html">Catalogo</a></li>
        <li><a href="chi-sono.html">Chi Sono</a></li>
        <li>
          <a href="carrello.html" class="cart-link active">
            🛒 Carrello <span class="cart-count" id="cartCount">0</span>
          </a>
        </li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <h1>Il tuo Carrello</h1>

    <div class="cart-grid">
      
      <!-- SEZIONE 1: LISTA PRODOTTI SELEZIONATI -->
      <div class="cart-box">
        <h2>Prodotti Scelti</h2>
        <div id="cartItemsContainer">
          <!-- I prodotti verranno inseriti dinamicamente via JS -->
        </div>

        <div class="cart-total-bar" id="totalBar" style="display: none;">
          <span>Totale Ordine:</span>
          <span id="cartGrandTotal" style="color: var(--accent-color);">0 €</span>
        </div>
      </div>

      <!-- SEZIONE 2: FORM DATI CLIENTE E INVIO VIA EMAIL -->
      <div class="checkout-box">
        <h2>Dati di Spedizione e Contatto</h2>
        
        <form action="https://api.web3forms.com/submit" method="POST" id="orderForm">
          
          <!-- INCOLLA QUI LA TUA ACCESS KEY DI WEB3FORMS -->
          <input type="hidden" name="access_key" value="0a58ea17-3e1b-4836-bb41-2114b6cc08d1">
          <input type="hidden" name="subject" value="Nuovo Ordine dal Sito - Renzo Losa">
          <input type="hidden" name="from_name" value="Renzo Losa E-Commerce">
          
          <!-- CAMPO NASCOSTO IN CUI VERRÀ INSERITO IL RIEPILOGO COMPLETO DEL CARRELLO -->
          <input type="hidden" name="Riepilogo_Ordine" id="orderSummaryInput">

          <div class="form-group">
            <label for="nome">Nome e Cognome *</label>
            <input type="text" id="nome" name="Nome_Cliente" required placeholder="Mario Rossi">
          </div>

          <div class="form-group">
            <label for="email">Indirizzo Email *</label>
            <input type="email" id="email" name="Email_Cliente" required placeholder="mario.rossi@esempio.com">
          </div>

          <div class="form-group">
            <label for="telefono">Telefono *</label>
            <input type="tel" id="telefono" name="Telefono_Cliente" required placeholder="333 1234567">
          </div>

          <div class="form-group">
            <label for="indirizzo">Indirizzo di Spedizione *</label>
            <textarea id="indirizzo" name="Indirizzo_Spedizione" rows="3" required placeholder="Via, civico, CAP, città e provincia"></textarea>
          </div>

          <div class="form-group">
            <label for="note">Note o richieste aggiuntive:</label>
            <textarea id="note" name="Note_Cliente" rows="2" placeholder="Particolari esigenze sulla consegna o personalizzazioni..."></textarea>
          </div>

          <button type="submit" class="btn-submit-order" id="submitBtn">Invia Richiesta d'Ordine</button>

        </form>
      </div>

    </div>
  </main>

  <footer>
    <p>&copy; Renzo Losa — Tutti i diritti riservati</p>
  </footer>

  <script>
    // --- LOGICA MENU MOBILE ---
    const menuToggle = document.getElementById('menuToggle');
    const navLinks = document.getElementById('navLinks');
    menuToggle.addEventListener('click', () => navLinks.classList.toggle('active'));

    // --- LOGICA CARRELLO ---
    function renderCart() {
      const cart = JSON.parse(localStorage.getItem('renzoLosaCart')) || [];
      const container = document.getElementById('cartItemsContainer');
      const totalBar = document.getElementById('totalBar');
      const cartCount = document.getElementById('cartCount');
      const submitBtn = document.getElementById('submitBtn');
      
      cartCount.innerText = cart.length;

      if (cart.length === 0) {
        container.innerHTML = `
          <div class="empty-cart-msg">
            <p>Il carrello è vuoto.</p>
            <a href="catalogo.html" style="color: var(--accent-color); font-weight: bold; display: inline-block; margin-top: 10px;">Torna al Catalogo per scegliere le tue creazioni</a>
          </div>
        `;
        totalBar.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.style.opacity = '0.5';
        submitBtn.style.cursor = 'not-allowed';
        return;
      }

      submitBtn.disabled = false;
      submitBtn.style.opacity = '1';
      submitBtn.style.cursor = 'pointer';

      let html = '';
      let total = 0;
      let summaryText = '';

      cart.forEach((item, index) => {
        total += item.price;
        
        // Dettagli dinamici a seconda delle opzioni dell'articolo
        let details = [];
        if (item.color) details.push(`Colore: ${item.color}`);
        if (item.height) details.push(`Altezza: ${item.height}`);
        if (item.size) details.push(`Taglia: ${item.size}`);
        if (item.finish) details.push(`Finitura: ${item.finish}`);
        if (item.engraving && item.engraving !== 'Nessuna') details.push(`Incisione: ${item.engraving}`);

        const detailsString = details.join(' | ');

        html += `
          <div class="cart-item">
            <div class="cart-item-info">
              <h4>${item.name}</h4>
              <div class="cart-item-details">${detailsString}</div>
              <div class="cart-item-price">${item.price} €</div>
            </div>
            <button class="btn-remove" onclick="removeFromCart(${index})" title="Rimuovi prodotto">&times;</button>
          </div>
        `;

        summaryText += `${index + 1}) ${item.name} - [${detailsString}] - Prezzo: ${item.price}€\n`;
      });

      container.innerHTML = html;
      document.getElementById('cartGrandTotal').innerText = total + " €";
      totalBar.style.display = 'flex';

      // Salva la stringa descrittiva nel campo nascosto del form per la mail
      summaryText += `\nTOTALE ORDINE: ${total}€`;
      document.getElementById('orderSummaryInput').value = summaryText;
    }

    function removeFromCart(index) {
      let cart = JSON.parse(localStorage.getItem('renzoLosaCart')) || [];
      cart.splice(index, 1);
      localStorage.setItem('renzoLosaCart', JSON.stringify(cart));
      renderCart();
    }

    // Quando la mail viene inviata con successo, svuotiamo il carrello
    document.getElementById('orderForm').addEventListener('submit', function() {
      setTimeout(() => {
        localStorage.removeItem('renzoLosaCart');
      }, 1000);
    });

    // Renderizza all'avvio
    renderCart();
  </script>
</body>
</html>
